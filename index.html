 const d=x.getImageData(0,0,c.width,c.height),p=d.data,h=getComputedStyle(document.documentElement).getPropertyValue('--cream').trim(),R=parseInt(h.slice(1,3),16),G=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16);

 j.items.forEach(i=>{let t=i.title.replace(/[\u0591-\u05C7]/g,'');if(XH.test(t)||(i.subcat=='modern'&&!XM.test(t)))return;const k=i.date.slice(0,10);if(/חנוכה/.test(t)){const n=ch(new Date(k+'T12:00'));if(!n)return;t=gm(n)+' חנוכה'}t=t.replace(/\s*\d{4}$/,'');if((o[k]=o[k]||[]).includes(t))return;o[k].push(t)});HC[y]=o;localStorage['h4'+y]=JSON.stringify(o)}catch(x){HC[y]={}}}
